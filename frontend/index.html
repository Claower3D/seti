<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />

    <!-- VIEWPORT: prevent zoom on input focus (iOS), ensure correct sizing -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

    <!-- PWA / App Meta -->
    <meta name="theme-color" content="#050510" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#050510" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SETI" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/logo.png?v=4" />
    <link rel="shortcut icon" type="image/png" href="/logo.png?v=4" />
    <link rel="apple-touch-icon" href="/logo.png?v=4" />

    <!-- Preconnect to speed up Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Preload critical font weights only (saves ~40% font download time) -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&family=Space+Grotesk:wght@400;700&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&family=Space+Grotesk:wght@400;700&display=swap" />

    <!-- Preconnect to API backend -->
    <link rel="preconnect" href="https://seti-production.up.railway.app" />

    <!-- SEO -->
    <meta name="description" content="SETI — Signal Frequency Network. Социальная сеть нового поколения." />
    <meta name="robots" content="noindex" />

    <title>SETI — Signal Frequency Network</title>

    <!-- Prevent flash of unstyled content (FOUC) — set bg immediately -->
    <style>
      html, body, #root {
        margin: 0; padding: 0;
        background: #050510;
        color: #e8eaf6;
        height: 100%;
        /* Dynamic viewport height for mobile browsers */
        min-height: 100dvh;
      }
      /* Spinner shown before React hydrates */
      #root:empty::after {
        content: '';
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #050510;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
